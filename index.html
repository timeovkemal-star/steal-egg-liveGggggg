<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🥚 Steal An Egg LIVE</title>
<style>
body{margin:0;background:#090b14;color:white;font-family:Arial,sans-serif}
main{max-width:600px;margin:auto;padding:20px}
h1{font-size:28px}
.card{background:#151927;border:1px solid #292f45;border-radius:18px;padding:18px;margin:14px 0}
.status{color:#55ff8a}
.egg{padding:14px 0;border-bottom:1px solid #292f45}
.pet{font-size:21px;font-weight:bold}
.badge{display:inline-block;padding:5px 9px;border-radius:8px;margin:5px 0;font-weight:bold}
.secret{background:#641d31;color:#ff7898}
.eternal{background:#3b2166;color:#d49cff}
.divine{background:#725819;color:#ffe278}
.info{color:#aeb5c8;line-height:1.7}
button{width:100%;padding:15px;border:0;border-radius:13px;background:#6847ff;color:white;font-size:16px;font-weight:bold}
</style>
</head>

<body>
<main>

<h1>🥚 Steal An Egg LIVE</h1>

<div class="card">
<div id="status" class="status">🟢 SITE LIVE</div>
<p>Source : Steal Egg / Eggipedia</p>
<p>Actualisation : <b>60 secondes</b></p>
</div>

<div class="card">
<h2>🔥 Dernier spawn</h2>
<div id="latest">Chargement…</div>
</div>

<div class="card">
<h2>📜 Historique</h2>
<div id="history">Chargement…</div>
</div>

<div class="card">
<h2>🔔 Alertes</h2>
<p>Secret / Eternal / Divine</p>
<button onclick="alert('Les alertes seront activées quand le flux JSON sera connecté.')">
Activer les alertes
</button>
</div>

</main>

<script>

const LIVE_PAGE =
"https://stealegg.com/en/live/";

async function load(){

document.getElementById("status").textContent =
"🟢 SITE LIVE";

document.getElementById("latest").innerHTML =
`
<div class="info">
Les données live sont disponibles sur la source officielle.<br><br>
<a href="${LIVE_PAGE}" target="_blank"
style="color:#8d78ff">
Ouvrir le LIVE Steal Egg →
</a>
</div>
`;

document.getElementById("history").innerHTML =
`
<div class="info">
La source contient actuellement les derniers spawns
et se met à jour automatiquement toutes les 60 secondes.
</div>
`;

}

load();

setInterval(load,60000);

</script>

</body>
</html>
