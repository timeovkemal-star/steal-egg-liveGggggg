<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b14">
<title>Steal An Egg — LIVE</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090b14;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif
}
.app{max-width:600px;margin:auto;padding:20px 16px 40px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:27px;margin:0}
.status{background:#12351e;color:#55ff8a;padding:7px 11px;border-radius:20px;font-size:13px}
.card{
 background:#131725;border:1px solid #252b40;border-radius:20px;
 padding:17px;margin-bottom:13px
}
.latest{border:1px solid #6847ff;box-shadow:0 0 25px #6847ff33}
.label{color:#9299ad;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.name{font-size:22px;font-weight:700;margin:7px 0}
.info{color:#aeb5c8;font-size:14px;line-height:1.7}
.badge{display:inline-block;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:700;margin-top:5px}
.secret{background:#641d31;color:#ff7898}
.eternal{background:#3b2166;color:#d49cff}
.divine{background:#725819;color:#ffe278}
.cosmic{background:#193f65;color:#70c9ff}
button{
 width:100%;border:0;border-radius:14px;padding:15px;
 background:#6847ff;color:white;font-size:16px;font-weight:700;margin-top:12px
}
.row{display:flex;justify-content:space-between;align-items:center}
.switch{width:48px;height:28px;border-radius:20px;background:#33394b;position:relative}
.switch.on{background:#6847ff}
.switch:after{
 content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;
 background:white;border-radius:50%;transition:.2s
}
.switch.on:after{left:23px}
.empty{text-align:center;color:#8d94a8;padding:25px}
.history-item{padding:12px 0;border-bottom:1px solid #252b40}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>🥚 Steal An Egg</h1>
<div class="status" id="status">Connexion…</div>
</div>

<div class="card latest">
<div class="label">Dernier spawn</div>
<div id="latest">Recherche des eggs…</div>
</div>

<div class="card">
<div class="row">
<div>
<b>🔔 Alertes</b><br>
<span class="info">Secret / Eternal / Divine</span>
</div>
<div class="switch on" id="alertSwitch"></div>
</div>

<button onclick="enableNotifications()">
🔔 Activer les notifications
</button>
</div>

<div class="card">
<div class="row">
<b>🔄 Actualisation</b>
<span id="countdown">60 s</span>
</div>
</div>

<div class="card">
<div class="label">Historique</div>
<div id="history">
<div class="empty">Chargement…</div>
</div>
</div>

</div>

<script>

const SOURCE = "https://stealegg.com/en/live/";

const IMPORTANT = [
"secret",
"eternal",
"divine"
];

let lastSeen = localStorage.getItem("lastEgg");
let alerts = true;
let seconds = 60;

function rarityClass(rarity){
 if(!rarity) return "";
 const r=String(rarity).toLowerCase();

 if(r.includes("secret")) return "secret";
 if(r.includes("eternal")) return "eternal";
 if(r.includes("divine")) return "divine";
 if(r.includes("cosmic")) return "cosmic";

 return "";
}

function showEgg(egg){

 const rarity =
 egg.rarity ||
 egg.rarity_name ||
 "Inconnue";

 const pet =
 egg.pet ||
 egg.pet_name ||
 egg.name ||
 egg.egg ||
 "Egg inconnu";

 const biome =
 egg.biome ||
 egg.biome_name ||
 "Biome inconnu";

 const time =
 egg.time ||
 egg.spawnedAt ||
 egg.spawned_at ||
 egg.created_at ||
 "";

 return `
 <div class="history-item">

 <div class="name">
 🥚 ${pet}
 </div>

 <span class="badge ${rarityClass(rarity)}">
 ${rarity}
 </span>

 <div class="info">
 📍 ${biome}<br>
 🕐 ${time}
 </div>

 </div>
 `;
}

async function loadEggs(){

 try{

 /*
  On récupère la page LIVE.
  Les données sont ensuite recherchées
  dans le HTML/JSON disponible.
 */

 const response =
 await fetch(
 SOURCE + "?t=" + Date.now(),
 {
 cache:"no-store",
 mode:"cors"
 }
 );

 if(!response.ok)
 throw new Error("Source inaccessible");

 const text =
 await response.text();

 /*
  Recherche de JSON intégré dans la page.
 */

 let eggs = [];

 const matches =
 text.match(
 /\{[^{}]*"(?:rarity|pet|biome)"[^{}]*\}/gi
 );

 if(matches){

  for(const item of matches){

   try{
    const obj=JSON.parse(item);
    eggs.push(obj);
   }catch(e){}

  }

 }

 document.getElementById("status")
 .textContent="🟢 CONNECTÉ";

 if(!eggs.length){

  document.getElementById("latest")
  .innerHTML=
  `<div class="empty">
  Source connectée.<br>
  Les données live nécessitent l'endpoint JSON exact.
  </div>`;

  return;
 }

 const latest=eggs[0];

 document.getElementById("latest")
 .innerHTML=showEgg(latest);

 document.getElementById("history")
 .innerHTML=
 eggs.slice(0,20)
 .map(showEgg)
 .join("");

 const id =
 latest.id ||
 latest.spawnId ||
 latest.spawn_id ||
 JSON.stringify(latest);

 if(lastSeen && id!==lastSeen){

  const rarity=
  String(latest.rarity||"").toLowerCase();

  if(
   alerts &&
   IMPORTANT.some(x=>rarity.includes(x))
  ){
   notifyEgg(latest);
  }
 }

 lastSeen=id;

 localStorage.setItem("lastEgg",id);

 }catch(error){

 console.error(error);

 document.getElementById("status")
 .textContent="🟠 HORS LIGNE";

 document.getElementById("latest")
 .innerHTML=
 `<div class="empty">
 Impossible de récupérer les données live.
 </div>`;
 }
}

function notifyEgg(egg){

 if(
 "Notification" in window &&
 Notification.permission==="granted"
 ){

 const rarity=
 egg.rarity||"Rare";

 const pet=
 egg.pet||egg.name||"Egg";

 new Notification(
 "🥚 STEAL AN EGG",
 {
 body:`${rarity} détecté : ${pet}`
 }
 );

 }
}

async function enableNotifications(){

 if(!("Notification" in window)){

 alert(
 "Les notifications ne sont pas disponibles dans ce navigateur."
 );

 return;
 }

 const permission=
 await Notification.requestPermission();

 if(permission==="granted"){

 alerts=true;

 document
 .getElementById("alertSwitch")
 .classList.add("on");

 new Notification(
 "🥚 Steal An Egg",
 {
 body:"Alertes activées !"
 }
 );

 }else{

 alert(
 "Autorisation des notifications refusée."
 );

 }
}

document
.getElementById("alertSwitch")
.onclick=function(){

 alerts=!alerts;

 this.classList.toggle("on",alerts);

};

loadEggs();

setInterval(
 loadEggs,
 60000
);

setInterval(()=>{

 seconds--;

 if(seconds<=0)
 seconds=60;

 document.getElementById("countdown")
 .textContent=seconds+" s";

},1000);

</script>

</body>
</html>
